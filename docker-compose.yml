services:
  db:
    # Versão do Postgres: padrão 15. Se o dump de produção foi feito por um
    # Postgres mais novo, defina POSTGRES_IMAGE_TAG=17-alpine (por ex.) no .env.
    image: postgres:${POSTGRES_IMAGE_TAG:-15-alpine}
    container_name: music-school-db
    ports:
      # Porta do host configurável via DB_PORT no .env (padrão 5432).
      # Se o Postgres de outro projeto (ex: Enfermaria) já usa 5432,
      # defina DB_PORT=5433 e use 5433 no DATABASE_URL do backend.
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
