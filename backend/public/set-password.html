<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar senha · Pianíssima</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f1ea;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: white;
        border-radius: 16px;
        padding: 32px 24px;
        max-width: 400px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 24px;
        color: #1a1a1a;
        text-align: center;
        margin-bottom: 8px;
      }
      .subtitle {
        color: #6b7280;
        font-size: 14px;
        text-align: center;
        margin-bottom: 24px;
      }
      label {
        display: block;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #9ca3af;
        margin-bottom: 6px;
      }
      .field {
        margin-bottom: 16px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #f5f1ea;
        font-size: 15px;
        color: #1a1a1a;
      }
      input:focus {
        outline: none;
        border-color: #b08d57;
        border-width: 1.5px;
      }
      button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: #b08d57;
        color: white;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-top: 8px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #dc2626;
        font-size: 13px;
        margin-top: 8px;
        text-align: center;
      }
      .success {
        text-align: center;
      }
      .success h1 {
        margin-bottom: 12px;
      }
      .store-links {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }
      .store-links a {
        flex: 1;
        text-align: center;
        padding: 12px;
        border-radius: 10px;
        background: #f5f1ea;
        color: #1a1a1a;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: -20px;
      }
      .logo {
        width: 200px;
        height: 200px;
        object-fit: contain;
      }
      .input-wrap {
        display: flex;
        align-items: center;
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #f5f1ea;
        overflow: hidden;
      }
      .input-wrap:focus-within {
        border-color: #b08d57;
        border-width: 1.5px;
      }
      .input-wrap input {
        border: none;
        background: transparent;
        flex: 1;
      }
      .input-wrap input:focus {
        border: none;
      }
      .eye-btn {
        background: none;
        border: none;
        padding: 0 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        width: auto;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div id="loading">
        <p class="subtitle" style="text-align: center">Validando convite...</p>
      </div>

      <div id="invalid" class="hidden">
        <h1>Link inválido ou expirado</h1>
        <p class="subtitle">
          Peça para a escola gerar um novo link de ativação.
        </p>
      </div>

      <div id="form" class="hidden">
        <div class="logo-wrap">
          <img src="/logo.png" alt="Pianíssima" class="logo" />
        </div>
        <h1>Criar senha</h1>
        <p class="subtitle" id="greeting"></p>

        <div class="field">
          <label>Nova senha</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              placeholder="Mínimo 6 caracteres"
            />
            <button
              type="button"
              class="eye-btn"
              onclick="toggleShowPassword()"
              aria-label="Mostrar ou ocultar senha"
            >
              <svg
                id="eyeIconPassword"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#B0AA9C"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label>Confirmar senha</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repita a senha"
            />
            <button
              type="button"
              class="eye-btn"
              onclick="toggleShowPassword()"
              aria-label="Mostrar ou ocultar senha"
            >
              <svg
                id="eyeIconConfirm"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#B0AA9C"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button id="submitBtn" onclick="handleSubmit()">
          Criar senha e continuar
        </button>
        <p class="error hidden" id="errorMsg"></p>
      </div>

      <div id="success" class="hidden success">
        <h1>Senha criada! 🎉</h1>
        <p class="subtitle">
          Agora baixe o app Pianíssima e faça login com seu e-mail e a senha que
          você acabou de criar.
        </p>
        <div class="store-links">
          <a href="#" id="androidLink">Play Store</a>
          <a href="#" id="iosLink">App Store</a>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      const el = (id) => document.getElementById(id);
      function show(id) {
        ['loading', 'invalid', 'form', 'success'].forEach((s) =>
          el(s).classList.add('hidden'),
        );
        el(id).classList.remove('hidden');
      }

      let showPassword = false;
      const eyeOpenPath =
        '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
      const eyeClosedPath =
        '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.9 19.9 0 0 1 4.22-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

      function toggleShowPassword() {
        showPassword = !showPassword;
        el('password').type = showPassword ? 'text' : 'password';
        el('confirmPassword').type = showPassword ? 'text' : 'password';
        el('eyeIconPassword').innerHTML = showPassword
          ? eyeClosedPath
          : eyeOpenPath;
        el('eyeIconConfirm').innerHTML = showPassword
          ? eyeClosedPath
          : eyeOpenPath;
      }

      el('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el('confirmPassword').focus();
        }
      });

      el('confirmPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          el('confirmPassword').blur();
        }
      });

      async function validateToken() {
        if (!token) {
          show('invalid');
          return;
        }
        try {
          const res = await fetch(
            `/auth/invite/validate?token=${encodeURIComponent(token)}`,
          );
          if (!res.ok) throw new Error();
          const data = await res.json();
          el('greeting').textContent =
            `Olá, ${data.name}! Defina uma senha para ${data.email}`;
          show('form');
        } catch {
          show('invalid');
        }
      }

      async function handleSubmit() {
        const password = el('password').value;
        const confirmPassword = el('confirmPassword').value;
        const errorEl = el('errorMsg');
        errorEl.classList.add('hidden');

        if (!password || !confirmPassword) {
          errorEl.textContent = 'Preencha os dois campos de senha';
          errorEl.classList.remove('hidden');
          return;
        }
        if (password.length < 6) {
          errorEl.textContent = 'A senha precisa ter pelo menos 6 caracteres';
          errorEl.classList.remove('hidden');
          return;
        }
        if (password !== confirmPassword) {
          errorEl.textContent = 'As senhas não coincidem';
          errorEl.classList.remove('hidden');
          return;
        }

        const btn = el('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
          const res = await fetch('/auth/set-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          if (!res.ok) throw new Error();
          show('success');
        } catch {
          errorEl.textContent =
            'Não foi possível definir sua senha. O link pode ter expirado.';
          errorEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Criar senha e continuar';
        }
      }

      validateToken();
    </script>
  </body>
</html>
